name: Export missing ZIP list

on:
  push:
    paths:
      - '.github/workflows/export-missing-list.yml'
  workflow_dispatch:

permissions:
  contents: read

actions:
  read: {}

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show missing count
        run: wc -l .bootstrap/missing-from-v26.tsv
      - name: Upload missing list
        uses: actions/upload-artifact@v4
        with:
          name: latest-zip-missing-list
          path: .bootstrap/missing-from-v26.tsv
          if-no-files-found: error
          retention-days: 1

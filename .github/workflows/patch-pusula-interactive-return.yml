name: Patch Pusula interactive return

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-pusula-interactive-return.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply interaction-only patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/GlobalPusulaBand.tsx')
          text = path.read_text()

          old = """  const dismissInteractive = (snooze = true) => {\n    if (snooze && interactiveNeed?.id) {\n      snoozeNeed(interactiveNeed.id);\n    }\n    setInteractiveOpen(false);\n    setInteractiveStep('main');\n    setHasInteractiveSignal(false);\n  };\n\n"""

          new = old + """  // İnteraktif Pusula aşağıdayken kullanıcı kartın veya logonun dışına\n  // dokunursa kartı kapat ve logoyu eski header konumuna geri getir.\n  useEffect(() => {\n    if (!interactiveOpen) return;\n\n    const handleOutsidePointer = (event: PointerEvent) => {\n      const target = event.target;\n      if (!(target instanceof Element)) return;\n      if (target.closest('.tp-interactive-pusula-card')) return;\n      if (target.closest('.tp-global-pusula-anchor')) return;\n\n      setInteractiveOpen(false);\n      setInteractiveStep('main');\n    };\n\n    document.addEventListener('pointerdown', handleOutsidePointer, true);\n    return () => {\n      document.removeEventListener('pointerdown', handleOutsidePointer, true);\n    };\n  }, [interactiveOpen]);\n\n"""

          if old not in text:
              raise SystemExit('dismissInteractive block not found')
          text = text.replace(old, new, 1)

          old_class = """            interactiveOpen ? ' tp-depot-pusula-active' : ''\n"""
          new_class = """            interactiveOpen && interactiveStep === 'main'\n              ? ' tp-depot-pusula-active'\n              : ''\n"""

          if old_class not in text:
              raise SystemExit('interactive active class block not found')
          text = text.replace(old_class, new_class, 1)

          path.write_text(text)
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "oguzhanozeren92-debug"
          git config user.email "oguzhanozeren92@gmail.com"
          git add src/components/GlobalPusulaBand.tsx
          git commit -m "fix(pusula): return interactive logo after answer or outside tap"
          git push origin HEAD:main

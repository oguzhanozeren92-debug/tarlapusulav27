name: Vendor TarlaPusula discovery photos
on:
  push:
    branches:
      - fix/discovery-photo-assets-20261016
    paths:
      - 'scripts/vendor-feature-photos.py'
      - '.github/workflows/vendor-feature-photos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Fetch and optimize 12 licensed photos
        run: python scripts/vendor-feature-photos.py
      - name: Commit verified assets to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/feature-discovery
          if git diff --staged --quiet; then
            echo "Photos already up to date"
          else
            git commit -m "assets: vendor 12 curated feature photographs locally"
            git push origin HEAD:fix/discovery-photo-assets-20261016
          fi

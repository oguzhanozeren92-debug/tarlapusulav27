name: Content Source and Turkish Quality Check

on:
  push:
    branches: [feat/content-sources-translation-bulk-reject-20261109]
  pull_request:
    paths:
      - 'src/features/content-admin/**'
      - 'supabase/functions/content-engine-scan/**'
      - 'supabase/functions/knowledge-content-scan/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/content-engine-scan/index.ts
      - run: deno check supabase/functions/knowledge-content-scan/index.ts

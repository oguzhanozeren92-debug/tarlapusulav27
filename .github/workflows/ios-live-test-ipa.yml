name: iOS Live Test IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'capacitor.config.ts'
      - 'ios/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ios-live-test-ipa.yml'

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-15
    env:
      CAPACITOR_LIVE_SERVER_URL: https://tarlapusulav27.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync live-test Capacitor config
        run: |
          npm run build
          npx cap sync ios

      - name: Build unsigned iPhone app
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-ios-live
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build-ios-live \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package live-test IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="build-ios-live/Build/Products/Debug-iphoneos/App.app"
          test -d "$APP_PATH"
          rm -rf Payload TarlaPusula-Canli-Test.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" "Payload/TarlaPusula.app"
          zip -qry TarlaPusula-Canli-Test.ipa Payload

      - name: Upload live-test IPA
        uses: actions/upload-artifact@v4
        with:
          name: TarlaPusula-iOS-Canli-Test
          path: TarlaPusula-Canli-Test.ipa
          if-no-files-found: error
          retention-days: 30

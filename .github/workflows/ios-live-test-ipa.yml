name: iOS Live Test IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ios-live-test-ipa.yml'

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-15
    env:
      VITE_PUBLIC_APP_URL: 'https://tarlapusulav27.vercel.app/'
      VITE_APPLE_SIGN_IN_ENABLED: 'true'
      VITE_REVENUECAT_IOS_PUBLIC_KEY: ${{ secrets.VITE_REVENUECAT_IOS_PUBLIC_KEY }}
      VITE_REVENUECAT_ANDROID_PUBLIC_KEY: ${{ secrets.VITE_REVENUECAT_ANDROID_PUBLIC_KEY }}
      CAPACITOR_LIVE_SERVER_URL: https://tarlapusulav27.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and sync live-test shell
        run: |
          npm run build
          npx cap sync ios

      - name: Generate official Pusula App Store icon
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/tp-ios-icon-venv"
          "$RUNNER_TEMP/tp-ios-icon-venv/bin/python" -m pip install 'Pillow>=10,<12'
          "$RUNNER_TEMP/tp-ios-icon-venv/bin/python" scripts/generate_ios_app_icon.py

      - name: Build unsigned iPhone app
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-ios
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build-ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned live-test IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="build-ios/Build/Products/Debug-iphoneos/App.app"
          test -d "$APP_PATH"
          rm -rf Payload TarlaPusula-Live-Test.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" "Payload/TarlaPusula.app"
          zip -qry TarlaPusula-Live-Test.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TarlaPusula-iOS-Live-Test
          path: TarlaPusula-Live-Test.ipa
          if-no-files-found: error
          retention-days: 30

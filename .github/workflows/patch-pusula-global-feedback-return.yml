name: Patch Pusula global feedback return

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-pusula-global-feedback-return.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply global feedback return patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/assets/pusula/PusulaGuide.tsx')
          text = path.read_text()

          old_like = """                      onClick={() => {\n                        setShowDislikeReasons(false);\n                        void submitFeedback(true);\n                      }}\n"""
          new_like = """                      onClick={() => {\n                        setShowDislikeReasons(false);\n                        void submitFeedback(true);\n                        window.setTimeout(() => closeMessage(), 420);\n                      }}\n"""
          if old_like not in text:
              raise SystemExit('like handler not found')
          text = text.replace(old_like, new_like, 1)

          old_reason = """                          onClick={() => void submitFeedback(false, option.value)}\n"""
          new_reason = """                          onClick={() => {\n                            void submitFeedback(false, option.value);\n                            window.setTimeout(() => closeMessage(), 420);\n                          }}\n"""
          if old_reason not in text:
              raise SystemExit('dislike reason handler not found')
          text = text.replace(old_reason, new_reason, 1)

          path.write_text(text)
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "oguzhanozeren92-debug"
          git config user.email "oguzhanozeren92@gmail.com"
          git add src/assets/pusula/PusulaGuide.tsx
          git commit -m "fix(pusula): return logo after global feedback response"
          git push origin HEAD:main

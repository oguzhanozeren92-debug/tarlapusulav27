name: Dependency audit fix dry run

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-fix-dryrun.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Show safe audit fixes
        run: npm audit fix --omit=dev --dry-run

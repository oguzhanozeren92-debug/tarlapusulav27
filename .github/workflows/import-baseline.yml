name: Import TarlaPusula baseline ZIP

on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find uploaded ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found in repository root."
            exit 1
          fi
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "Using $ZIP_FILE"

      - name: Extract ZIP to temporary folder
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/tarlapusula-baseline
          mkdir -p /tmp/tarlapusula-baseline
          unzip -q -o "${{ steps.zip.outputs.zip_file }}" -d /tmp/tarlapusula-baseline

      - name: Replace repository contents with ZIP baseline
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="${{ steps.zip.outputs.zip_file }}"
          ZIP_BASENAME="$(basename "$ZIP_FILE")"

          # Remove current repository content, while keeping .git and the
          # temporary workflow alive until this job finishes.
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name "$ZIP_BASENAME" \
            -exec rm -rf {} +

          # Copy the uploaded StackBlitz baseline exactly into the repo.
          cp -a /tmp/tarlapusula-baseline/. .

          # The uploaded archive is only a transport file.
          rm -f "$ZIP_FILE"

          # Remove this temporary importer, but preserve any .github files
          # that came from the real TarlaPusula ZIP.
          rm -f .github/workflows/import-baseline.yml

          # Remove empty workflow directory only when nothing from the ZIP
          # remains in it.
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit imported baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TarlaPusula Baseline Importer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Import TarlaPusula baseline from StackBlitz ZIP"
          git push origin HEAD:main

name: Refactor core entry visuals

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/refactor-core-entry-visuals.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply monochrome mobile cleanup
        shell: bash
        env:
          AUTH_PATCH_B64: ''
          ONBOARDING_PATCH_B64: ''
          ADD_FIELD_PATCH_B64: ''
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          patches = {
              Path('src/pages/Auth/Auth.css'): os.environ['AUTH_PATCH_B64'],
              Path('src/pages/Onboarding/Onboarding.css'): os.environ['ONBOARDING_PATCH_B64'],
              Path('src/pages/AddFieldMobile.css'): os.environ['ADD_FIELD_PATCH_B64'],
          }
          marker = 'REFACTOR 0.5 — MONOCHROME'
          for path, encoded in patches.items():
              text = path.read_text()
              if marker in text:
                  continue
              patch = base64.b64decode(encoded).decode('utf-8')
              path.write_text(text.rstrip() + '\n\n' + patch)
          PY

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Commit core visual cleanup
        shell: bash
        run: |
          git config user.name "oguzhanozeren92-debug"
          git config user.email "oguzhanozeren92@gmail.com"
          git add src/pages/Auth/Auth.css src/pages/Onboarding/Onboarding.css src/pages/AddFieldMobile.css
          git commit -m "refactor(ui): unify auth onboarding and add-field visuals"
          git push origin HEAD:main

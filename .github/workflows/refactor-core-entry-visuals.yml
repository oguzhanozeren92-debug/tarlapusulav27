name: Refactor core entry visuals

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/refactor-core-entry-visuals.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply monochrome mobile cleanup to Auth, Onboarding and Add Field
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          patches = {
            Path('src/pages/Auth/Auth.css'): r'''

/* =========================================================
   REFACTOR 0.5 — MONOCHROME MOBILE AUTH
   Pusula artwork remains untouched; only surrounding UI is unified.
   ========================================================= */
.tp-authv2 {
  color-scheme: dark;
  background-color: #050505 !important;
  background-image:
    radial-gradient(circle at 50% -8%, rgba(255,255,255,.07), transparent 34%),
    linear-gradient(180deg, #080808 0%, #050505 52%, #020202 100%) !important;
}

.tp-authv2::before {
  background:
    radial-gradient(circle at 18% 26%, rgba(255,255,255,.025), transparent 34%),
    radial-gradient(circle at 84% 72%, rgba(255,255,255,.018), transparent 32%) !important;
}

.tp-authv2-wordmark {
  color: #f5f5f5 !important;
  filter: none !important;
}

.tp-authv2-wordmark::before {
  background: radial-gradient(ellipse at center, rgba(255,255,255,.11), rgba(255,255,255,.035) 42%, transparent 74%) !important;
}

.tp-authv2-wordmark span,
.tp-authv2-wordmark strong {
  background: none !important;
  color: #f5f5f5 !important;
  -webkit-text-fill-color: #f5f5f5 !important;
  text-shadow: none !important;
}

.tp-authv2-wordmark strong {
  color: #ffffff !important;
  -webkit-text-fill-color: #ffffff !important;
}

.tp-authv2-wordmark::after {
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.24), transparent) !important;
}

.tp-authv2-wordmark-shine {
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.72), rgba(255,255,255,.28), transparent) !important;
}

.tp-authv2-brand p {
  color: #a8a8a8 !important;
}

.tp-authv2-panel.tp-ui-card {
  background: rgba(11,11,11,.96) !important;
  border: 1px solid #242424 !important;
  box-shadow: 0 18px 42px rgba(0,0,0,.28) !important;
  backdrop-filter: none !important;
}

.tp-authv2-panel h1,
.tp-authv2-group > label,
.tp-authv2-remember-copy strong,
.tp-authv2-feature strong {
  color: #f5f5f5 !important;
}

.tp-authv2-input {
  background: #111111 !important;
  border-color: #303030 !important;
  box-shadow: none !important;
}

.tp-authv2-input:focus-within {
  border-color: #f5f5f5 !important;
  box-shadow: 0 0 0 2px rgba(255,255,255,.08) !important;
}

.tp-authv2-input input {
  background: transparent !important;
  color: #f5f5f5 !important;
}

.tp-authv2-input input::placeholder {
  color: #737373 !important;
}

.tp-authv2-input-icon,
.tp-authv2-eye {
  color: #a8a8a8 !important;
}

.tp-authv2-eye {
  background: transparent !important;
  border-color: transparent !important;
}

.tp-authv2-remember,
.tp-authv2-footer,
.tp-authv2-message {
  color: #a8a8a8 !important;
}

.tp-authv2-remember-copy small,
.tp-authv2-footer > span {
  color: #848484 !important;
}

.tp-authv2-checkmark {
  background: #111111 !important;
  border-color: #3a3a3a !important;
}

.tp-authv2-remember input:checked + .tp-authv2-checkmark {
  background: #f5f5f5 !important;
  border-color: #f5f5f5 !important;
  color: #080808 !important;
}

.tp-authv2-message {
  background: #111111 !important;
  border-color: #2d2d2d !important;
}

.tp-authv2-feature.tp-ui-card {
  background: #0b0b0b !important;
  border-color: #242424 !important;
  box-shadow: none !important;
}

.tp-authv2-feature-icon {
  background: #151515 !important;
  border-color: #2b2b2b !important;
  color: #f5f5f5 !important;
}

.tp-authv2-feature-icon svg {
  stroke: currentColor !important;
}

.tp-authv2-feature-chevron {
  color: #666666 !important;
}

.tp-authv2 .tp-ui-button--primary,
.tp-authv2-primary.tp-ui-button {
  background: #f5f5f5 !important;
  border-color: #f5f5f5 !important;
  color: #080808 !important;
  box-shadow: none !important;
}

.tp-authv2 .tp-ui-button--secondary {
  background: #111111 !important;
  border-color: #333333 !important;
  color: #f5f5f5 !important;
}
''',

            Path('src/pages/Onboarding/Onboarding.css'): r'''

/* =========================================================
   REFACTOR 0.5 — MONOCHROME ONBOARDING / READY
   ========================================================= */
.tp-ob-page {
  color-scheme: dark;
  color: #f5f5f5 !important;
  background: linear-gradient(180deg, #080808 0%, #050505 54%, #020202 100%) !important;
}

.tp-ob-page::before,
.tp-ob-page::after,
.tp-ob-pattern {
  opacity: .18 !important;
  filter: invert(1) grayscale(1) !important;
}

.tp-ob-shell.tp-ui-card,
.tp-ready-shell.tp-ui-card {
  background: rgba(11,11,11,.97) !important;
  border-color: #242424 !important;
  box-shadow: 0 18px 44px rgba(0,0,0,.26) !important;
  backdrop-filter: none !important;
}

.tp-ob-back.tp-ui-button {
  background: #111111 !important;
  border-color: #303030 !important;
  color: #f5f5f5 !important;
}

.tp-ob-step,
.tp-ob-copy > p,
.tp-ready-lead,
.tp-ready-progress-copy span {
  color: #a8a8a8 !important;
}

.tp-ob-step strong,
.tp-ob-copy h1,
.tp-ready-shell h1,
.tp-ready-progress-copy strong,
.tp-ready-benefit p,
.tp-ob-option-label,
.tp-ob-other label {
  color: #f5f5f5 !important;
}

.tp-ob-progress span {
  background: #252525 !important;
}

.tp-ob-progress span.is-active {
  background: #f5f5f5 !important;
}

.tp-ob-kicker {
  color: #7e7e7e !important;
}

.tp-ob-option {
  border-color: #262626 !important;
  background: #0f0f0f !important;
  color: #f5f5f5 !important;
  box-shadow: none !important;
}

.tp-ob-option:hover {
  border-color: #444444 !important;
  background: #121212 !important;
}

.tp-ob-option.is-selected {
  border-color: #f5f5f5 !important;
  background: #171717 !important;
  box-shadow: none !important;
}

.tp-ob-option-icon,
.tp-ready-benefit-icon {
  background: #191919 !important;
  color: #f5f5f5 !important;
}

.tp-ob-option-check {
  background: #111111 !important;
  border-color: #383838 !important;
  color: #111111 !important;
}

.tp-ob-option.is-selected .tp-ob-option-check {
  background: #f5f5f5 !important;
  border-color: #f5f5f5 !important;
  color: #080808 !important;
}

.tp-ob-other.tp-ui-card,
.tp-ready-progress-card.tp-ui-card,
.tp-ready-benefit.tp-ui-card {
  background: #101010 !important;
  border-color: #282828 !important;
  box-shadow: none !important;
}

.tp-ob-other input {
  background: #171717 !important;
  border-color: #333333 !important;
  color: #f5f5f5 !important;
}

.tp-ob-other input::placeholder {
  color: #737373 !important;
}

.tp-ob-other input:focus {
  border-color: #f5f5f5 !important;
  box-shadow: 0 0 0 2px rgba(255,255,255,.08) !important;
}

.tp-ob-other small,
.tp-ob-message {
  color: #8f8f8f !important;
}

.tp-ob-message {
  background: #111111 !important;
  border-color: #2b2b2b !important;
}

.tp-ready-check {
  background: #f5f5f5 !important;
  color: #080808 !important;
  box-shadow: 0 0 0 7px rgba(255,255,255,.035) !important;
}

.tp-ready-progress-bar {
  background: #252525 !important;
}

.tp-ready-progress-bar span {
  background: #f5f5f5 !important;
}
''',

            Path('src/pages/AddFieldMobile.css'): r'''

/* =========================================================
   REFACTOR 0.5 — MONOCHROME ADD FIELD
   Field logic, map geometry and compass artwork are untouched.
   ========================================================= */
.tp-chat-field {
  color-scheme: dark;
  color: #f5f5f5 !important;
  background: linear-gradient(180deg, #080808 0%, #050505 54%, #020202 100%) !important;
}

.tp-chat-field::before,
.tp-chat-field::after {
  opacity: .15 !important;
  filter: invert(1) grayscale(1) !important;
}

.tp-field-back {
  background: #111111 !important;
  border-color: #303030 !important;
  color: #f5f5f5 !important;
  box-shadow: none !important;
}

.tp-field-brand-word {
  filter: none !important;
  color: #f5f5f5 !important;
}

.tp-field-brand-word span,
.tp-field-brand-word strong {
  color: #f5f5f5 !important;
}

.tp-field-brand small,
.tp-field-eyebrow,
.tp-note {
  color: #858585 !important;
}

.tp-field-step-badge {
  background: #f5f5f5 !important;
  color: #080808 !important;
  box-shadow: none !important;
}

.tp-field-step {
  background: #0d0d0d !important;
  border-color: #242424 !important;
  color: #7d7d7d !important;
}

.tp-field-step i {
  background: #191919 !important;
  color: #969696 !important;
}

.tp-field-step.is-current {
  background: #151515 !important;
  border-color: #f5f5f5 !important;
  color: #f5f5f5 !important;
  box-shadow: none !important;
}

.tp-field-step.is-current i {
  background: #f5f5f5 !important;
  color: #080808 !important;
}

.tp-field-step.is-done {
  color: #c7c7c7 !important;
}

.tp-field-step.is-done i {
  background: #333333 !important;
  color: #ffffff !important;
}

.tp-field-hero {
  border-color: #262626 !important;
  background: linear-gradient(135deg, #111111 0%, #090909 100%) !important;
  box-shadow: none !important;
}

.tp-field-hero::before {
  opacity: .16 !important;
  filter: invert(1) grayscale(1) !important;
}

.tp-field-hero::after {
  background: linear-gradient(90deg, #f5f5f5 0 36%, #787878 36% 54%, #292929 54% 100%) !important;
}

.tp-field-hero h1 {
  color: #f5f5f5 !important;
}

.tp-field-hero p {
  color: #a8a8a8 !important;
}

.tp-field-form {
  background: rgba(11,11,11,.97) !important;
  border-color: #242424 !important;
  box-shadow: none !important;
  backdrop-filter: none !important;
}

.tp-field-form label {
  background: #111111 !important;
  border-color: #242424 !important;
  color: #f5f5f5 !important;
}

.tp-field-form input,
.tp-field-form textarea,
.tp-chat-field .tp-mobile-picker-trigger {
  background: #171717 !important;
  border-color: #333333 !important;
  color: #f5f5f5 !important;
  box-shadow: none !important;
}

.tp-field-form input::placeholder,
.tp-field-form textarea::placeholder {
  color: #727272 !important;
}

.tp-field-form input:focus,
.tp-field-form textarea:focus,
.tp-chat-field .tp-mobile-picker-trigger:focus-visible {
  border-color: #f5f5f5 !important;
  box-shadow: 0 0 0 2px rgba(255,255,255,.08) !important;
}

.tp-found {
  background: #111111 !important;
  border-color: #292929 !important;
  color: #d6d6d6 !important;
}

.tp-field-primary-action,
.tp-field-actions .next {
  background: #f5f5f5 !important;
  border-color: #f5f5f5 !important;
  color: #080808 !important;
  box-shadow: none !important;
}

.tp-field-actions .back {
  background: #111111 !important;
  border-color: #333333 !important;
  color: #f5f5f5 !important;
}

.tp-chat-field :is(.tp-parcel-mode,.tp-map-boundary-card,.tp-map-boundary-status,.tp-map-boundary-candidate,.tp-field-summary-card) {
  background: #101010 !important;
  border-color: #292929 !important;
  color: #f5f5f5 !important;
  box-shadow: none !important;
}
'''
          }

          marker = 'REFACTOR 0.5 — MONOCHROME'
          for path, patch in patches.items():
            text = path.read_text()
            if marker in text:
              continue
            path.write_text(text.rstrip() + '\n' + patch.strip() + '\n')
          PY

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Commit core visual cleanup
        shell: bash
        run: |
          git config user.name "oguzhanozeren92-debug"
          git config user.email "oguzhanozeren92@gmail.com"
          git add src/pages/Auth/Auth.css src/pages/Onboarding/Onboarding.css src/pages/AddFieldMobile.css
          git commit -m "refactor(ui): unify auth onboarding and add-field visuals"
          git push origin HEAD:main

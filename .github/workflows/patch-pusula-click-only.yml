name: Patch Pusula click-only playback

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-pusula-click-only.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply click-only playback patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/assets/pusula/PusulaGuide.tsx')
          text = path.read_text()

          old_refs = """  const runRef = useRef(0);\n  const lastPlayedIdRef = useRef<string | null>(null);\n  const keepOpenRef = useRef(false);\n  const guideRootRef = useRef<HTMLDivElement | null>(null);\n"""
          new_refs = """  const runRef = useRef(0);\n  const lastPlayedIdRef = useRef<string | null>(null);\n  const keepOpenRef = useRef(false);\n  const guideRootRef = useRef<HTMLDivElement | null>(null);\n  const userRequestedPlayRef = useRef(false);\n"""
          if old_refs not in text:
              raise SystemExit('ref block not found')
          text = text.replace(old_refs, new_refs, 1)

          old_effect = """  useEffect(() => {\n    if (!insight?.id) return;\n    if (!assetsReady) return;\n    if (lastPlayedIdRef.current === insight.id) return;\n\n    lastPlayedIdRef.current = insight.id;\n\n    void playInsight(insight);\n  }, [insight?.id, assetsReady]);\n"""
          new_effect = """  useEffect(() => {\n    if (!insight?.id) return;\n    if (!assetsReady) return;\n\n    // Yeni mesaj gelmesi yalnızca üstte sinyal/ışıltı üretir.\n    // Pusula ancak kullanıcı logoya dokunduysa aşağı inip konuşur.\n    if (!userRequestedPlayRef.current) return;\n    userRequestedPlayRef.current = false;\n\n    if (lastPlayedIdRef.current === insight.id) {\n      void replayLastMessage();\n      return;\n    }\n\n    lastPlayedIdRef.current = insight.id;\n    void playInsight(insight);\n  }, [insight?.id, assetsReady]);\n"""
          if old_effect not in text:
              raise SystemExit('autoplay effect not found')
          text = text.replace(old_effect, new_effect, 1)

          old_click = """        onClick={() => {\n          if (phase !== 'idle') return;\n          if (onLogoClick) {\n            onLogoClick();\n            return;\n          }\n          void replayLastMessage();\n        }}\n"""
          new_click = """        onClick={() => {\n          if (phase !== 'idle') return;\n\n          userRequestedPlayRef.current = true;\n\n          if (onLogoClick) {\n            onLogoClick();\n            return;\n          }\n\n          if (insight?.id) {\n            if (lastPlayedIdRef.current === insight.id) {\n              userRequestedPlayRef.current = false;\n              void replayLastMessage();\n            } else {\n              userRequestedPlayRef.current = false;\n              lastPlayedIdRef.current = insight.id;\n              void playInsight(insight);\n            }\n            return;\n          }\n\n          userRequestedPlayRef.current = false;\n          void replayLastMessage();\n        }}\n"""
          if old_click not in text:
              raise SystemExit('logo click handler not found')
          text = text.replace(old_click, new_click, 1)

          path.write_text(text)
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "oguzhanozeren92-debug"
          git config user.email "oguzhanozeren92@gmail.com"
          git add src/assets/pusula/PusulaGuide.tsx
          git commit -m "fix(pusula): only drop on explicit logo click"
          git push origin HEAD:main

name: Cleanup theme foundation

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-theme-foundation.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Neutralize legacy UI chrome without touching data colours
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('src/index.css')
          text = index.read_text()
          replacements = {
            'TARLAPUSULA — BASE / LEGACY LAYOUT\n   Neon Cyber-Agri / Obsidian Glassmorphism': 'TARLAPUSULA — BASE / LEGACY LAYOUT\n   Neutral black-and-white application fallback',
            'background: #020804;\n  color-scheme: dark;': 'background: #050505;\n  color-scheme: dark;',
            'background:\n    radial-gradient(circle at 50% -14%, rgba(34, 197, 94, 0.07), transparent 30%),\n    linear-gradient(180deg, #040d06 0%, #020804 58%, #010402 100%);': 'background: linear-gradient(180deg, #070707 0%, #050505 58%, #020202 100%);',
            'outline: 2px solid rgba(34, 197, 94, 0.70);': 'outline: 2px solid rgba(255, 255, 255, 0.82);',
            'background:\n    radial-gradient(circle at 50% -10%, rgba(34, 197, 94, 0.045), transparent 30%),\n    #020804;': 'background: #050505;',
            'border-bottom: 1px solid #1e3a24;\n  background: rgba(4, 13, 6, 0.90);': 'border-bottom: 1px solid #242424;\n  background: rgba(5, 5, 5, 0.94);',
          }
          for old, new in replacements.items():
            if old not in text:
              raise SystemExit(f'index.css block not found: {old[:70]!r}')
            text = text.replace(old, new, 1)
          index.write_text(text)

          theme = Path('src/styles/TarlaPusulaTheme.css')
          text = theme.read_text()
          replacements = {
            '--tp-primary: #65d8ee;': '--tp-primary: #f5f5f5;',
            '--tp-primary-strong: #92e8f8;': '--tp-primary-strong: #ffffff;',
            '--tp-primary-soft: #36aac1;': '--tp-primary-soft: #a3a3a3;',
            '--tp-primary-dark: #123944;': '--tp-primary-dark: #1a1a1a;',
            '--tp-cyan: #65d8ee;': '--tp-cyan: #f5f5f5;',
            '--tp-cyan-strong: #92e8f8;': '--tp-cyan-strong: #ffffff;',
            '--tp-cyan-soft: #36aac1;': '--tp-cyan-soft: #a3a3a3;',
            'rgba(101, 216, 238, 0.45);': 'rgba(255, 255, 255, 0.34);',
            'rgba(101, 216, 238, 0.30);': 'rgba(255, 255, 255, 0.20);',
            '--tp-green:\n    var(--tp-health);': '--tp-green:\n    #f5f5f5;',
            '--tp-green-strong:\n    #72e99b;': '--tp-green-strong:\n    #ffffff;',
            '--tp-green-soft:\n    #31b968;': '--tp-green-soft:\n    #a3a3a3;',
            '--tp-green-dark:\n    #164d2c;': '--tp-green-dark:\n    #1a1a1a;',
            'rgba(101, 216, 238, 0.022),': 'rgba(255, 255, 255, 0.018),',
          }
          for old, new in replacements.items():
            if old not in text:
              raise SystemExit(f'TarlaPusulaTheme.css block not found: {old[:70]!r}')
            text = text.replace(old, new, 1)
          theme.write_text(text)
          PY

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "oguzhanozeren92-debug"
          git config user.email "oguzhanozeren92@gmail.com"
          git add src/index.css src/styles/TarlaPusulaTheme.css
          git commit -m "refactor(ui): neutralize legacy theme foundation"
          git push origin HEAD:main

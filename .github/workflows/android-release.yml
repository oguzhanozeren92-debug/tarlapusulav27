name: TarlaPusula Android Play AAB
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Android versionCode (must exceed all uploaded builds)'
        required: true
        type: string
      version_name:
        description: 'Android versionName'
        required: true
        default: '1.0.2'
        type: string
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VITE_APP_STORE_RELEASE: 'true'
      VITE_PUBLIC_APP_URL: 'https://tarlapusulav27.vercel.app/'
      VITE_ADMOB_TEST_MODE: 'false'
      TP_ANDROID_VERSION_CODE: ${{ inputs.version_code }}
      TP_ANDROID_VERSION_NAME: ${{ inputs.version_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          command -v sdkmanager
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install and sync
        run: |
          npm install
          npm run build
          npx cap sync android
          test -s android/app/google-services.json
      - name: Build signed release
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          TP_ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TP_ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TP_ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          [[ "$TP_ANDROID_VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          [ "$TP_ANDROID_VERSION_CODE" -le 2100000000 ]
          : "${KEYSTORE_BASE64:?Missing upload keystore secret}"
          : "${TP_ANDROID_UPLOAD_STORE_PASSWORD:?Missing store password}"
          : "${TP_ANDROID_UPLOAD_KEY_ALIAS:?Missing key alias}"
          : "${TP_ANDROID_UPLOAD_KEY_PASSWORD:?Missing key password}"
          export TP_ANDROID_UPLOAD_STORE_FILE="$RUNNER_TEMP/tarlapusula-upload.jks"
          trap 'rm -f "$TP_ANDROID_UPLOAD_STORE_FILE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$TP_ANDROID_UPLOAD_STORE_FILE"
          chmod 600 "$TP_ANDROID_UPLOAD_STORE_FILE"
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
          keytool -printcert -jarfile app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: TarlaPusula-Play-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

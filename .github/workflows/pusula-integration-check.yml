name: Pusula Integration Check

on:
  push:
    branches:
      - feat/pusula-outcome-followup-20261109
  pull_request:
    paths:
      - 'src/features/pusula/**'
      - 'src/assets/pusula/**'
      - 'src/pages/Home/**'
      - 'supabase/functions/send-due-reminders/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

name: Bootstrap v27 from v26

on:
  push:
    paths:
      - '.github/workflows/bootstrap-v27-from-v26.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v27
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone v26 baseline
        run: |
          git clone --depth 1 https://github.com/oguzhanozeren92-debug/tarlapusulav26.git /tmp/tarlapusulav26

      - name: Copy v26 into v27
        run: |
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            /tmp/tarlapusulav26/ ./

      - name: Commit baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Bootstrap v27 from v26 baseline"
          git push origin HEAD:main

name: Apply TarlaPusula Working Overlay

on:
  push:
    branches: [main]
    paths:
      - 'project-overlay.b64'
      - '.github/workflows/apply-working-overlay.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and apply working overlay
        shell: bash
        run: |
          set -euo pipefail
          test -f project-overlay.b64
          base64 -d project-overlay.b64 > /tmp/tarlapusula-overlay.zip
          unzip -oq /tmp/tarlapusula-overlay.zip -d .
          rm -f project-overlay.b64

      - name: Commit synchronized working code
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Working code already synchronized.'
            exit 0
          fi
          git commit -m 'sync: apply latest TarlaPusula working code'
          git push origin HEAD:main

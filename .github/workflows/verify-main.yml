name: Verify main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # The repository already has a large pre-existing TypeScript error
      # baseline. Keep surfacing that debt without making every main commit
      # permanently red; tests and the production build remain hard gates.
      - name: Typecheck (legacy baseline, advisory)
        continue-on-error: true
        run: npm run typecheck

      - name: Build
        run: npm run build

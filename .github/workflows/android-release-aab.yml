name: Android Release AAB Compile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android-release-aab.yml'

concurrency:
  group: android-release-aab-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  aab:
    runs-on: ubuntu-latest
    env:
      VITE_PUBLIC_APP_URL: 'https://tarlapusulav27.vercel.app/'
      VITE_REVENUECAT_IOS_PUBLIC_KEY: ${{ secrets.VITE_REVENUECAT_IOS_PUBLIC_KEY }}
      VITE_REVENUECAT_ANDROID_PUBLIC_KEY: ${{ secrets.VITE_REVENUECAT_ANDROID_PUBLIC_KEY }}
      # This artifact is an unsigned release-configuration compile check.
      # It is not uploaded to Google Play by this workflow.
      VITE_ADMOB_TEST_MODE: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build and sync production web assets
        run: |
          npm run build
          npx cap sync android

      - name: Verify critical native plugins
        shell: bash
        run: |
          set -euo pipefail
          npx cap ls android | tee "$RUNNER_TEMP/cap-android-plugins.txt"
          grep -Fq '@revenuecat/purchases-capacitor' "$RUNNER_TEMP/cap-android-plugins.txt" || {
            echo "::error::RevenueCat native plugin is not installed for android"
            exit 1
          }
          grep -Fq '@capacitor-community/admob' "$RUNNER_TEMP/cap-android-plugins.txt" || {
            echo "::error::AdMob native plugin is not installed for android"
            exit 1
          }

      - name: Compile release AAB
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew bundleRelease

      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@v4
        with:
          name: TarlaPusula-Android-Release-Unsigned-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

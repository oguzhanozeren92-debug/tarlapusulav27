name: iOS Simulator Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/ios-simulator-build.yml'

concurrency:
  group: ios-simulator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    env:
      VITE_PUBLIC_APP_URL: 'https://tarlapusulav27.vercel.app/'
      VITE_REVENUECAT_IOS_PUBLIC_KEY: ${{ secrets.VITE_REVENUECAT_IOS_PUBLIC_KEY }}
      VITE_REVENUECAT_ANDROID_PUBLIC_KEY: ${{ secrets.VITE_REVENUECAT_ANDROID_PUBLIC_KEY }}
      VITE_ADMOB_TEST_MODE: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and sync web assets
        run: |
          npm run build
          npx cap sync ios

      - name: Boot iPad Air 11-inch simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          # Prefer the exact device used by App Review, available on iOS 26.2.
          DEVICE_ID=$(xcrun simctl list devices available | grep 'iPad Air 11-inch (M3)' | tail -1 | awk -F '[()]' '{print $(NF-1)}' | tr -d ' ')
          if [ -z "$DEVICE_ID" ]; then
            DEVICE_ID=$(xcrun simctl list devices available | grep 'iPad Air' | tail -1 | awk -F '[()]' '{print $(NF-1)}' | tr -d ' ')
          fi
          if [ -z "$DEVICE_ID" ]; then
            echo "No available iPad Air simulator found"
            exit 1
          fi
          echo "IPAD_UDID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Compile iOS simulator target
        shell: bash
        run: |
          xcodebuild             -project ios/App/App.xcodeproj             -scheme App             -configuration Debug             -sdk iphonesimulator             CODE_SIGNING_ALLOWED=NO             build

      - name: Install, launch and capture iPad screenshots
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Debug-iphonesimulator/App.app' -type d -print -quit)
          test -n "$APP_PATH"
          xcrun simctl install "$IPAD_UDID" "$APP_PATH"
          mkdir -p ipad-screenshots
          xcrun simctl launch "$IPAD_UDID" com.tarlapusula.app
          sleep 20
          xcrun simctl io "$IPAD_UDID" screenshot ipad-screenshots/ipad-air-11-portrait.png
          xcrun simctl ui "$IPAD_UDID" appearance light
          xcrun simctl status_bar "$IPAD_UDID" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          xcrun simctl io "$IPAD_UDID" screenshot ipad-screenshots/ipad-air-11-portrait-clean.png
          xcrun simctl terminate "$IPAD_UDID" com.tarlapusula.app || true

      - name: Upload iPad screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipad-air-11-review-screenshots
          path: ipad-screenshots/*.png
          if-no-files-found: warn
          retention-days: 14

name: iOS Simulator Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/ios-simulator-build.yml'

concurrency:
  group: ios-simulator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    env:
      VITE_PUBLIC_APP_URL: 'https://tarlapusulav27.vercel.app/'
      VITE_REVENUECAT_IOS_PUBLIC_KEY: ${{ secrets.VITE_REVENUECAT_IOS_PUBLIC_KEY }}
      VITE_REVENUECAT_ANDROID_PUBLIC_KEY: ${{ secrets.VITE_REVENUECAT_ANDROID_PUBLIC_KEY }}
      VITE_ADMOB_TEST_MODE: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and sync web assets
        run: |
          npm run build
          npx cap sync ios

      - name: Boot iPad Air 11-inch simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          # simctl JSON gives a stable UDID, unlike splitting names containing parentheses.
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; a=[v for group in d.values() for v in group if v["name"]=="iPad Air 11-inch (M3)" and v["isAvailable"]]; print(a[-1]["udid"] if a else "")')
          if [ -z "$DEVICE_ID" ]; then
            DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; a=[v for group in d.values() for v in group if "iPad Air" in v["name"] and v["isAvailable"]]; print(a[-1]["udid"] if a else "")')
          fi
          if [ -z "$DEVICE_ID" ]; then
            echo "No available iPad Air simulator found"
            exit 1
          fi
          echo "IPAD_UDID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Compile iOS simulator target
        shell: bash
        run: |
          xcodebuild             -project ios/App/App.xcodeproj             -scheme App             -configuration Debug             -sdk iphonesimulator             CODE_SIGNING_ALLOWED=NO             build

      - name: Install, launch and capture timed iPad diagnostics
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          APP_PATH=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Debug-iphonesimulator/App.app' -type d -print -quit)
          test -n "$APP_PATH"
          mkdir -p ipad-screenshots ipad-diagnostics
          xcrun simctl install "$IPAD_UDID" "$APP_PATH"
          xcrun simctl status_bar "$IPAD_UDID" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100 || true
          xcrun simctl spawn "$IPAD_UDID" log stream --style compact --level error --predicate 'process == "App" OR process == "WebKit" OR process == "WebContent" OR subsystem CONTAINS "WebKit"' > ipad-diagnostics/app-runtime-errors.log 2>&1 &
          LOG_PID=$!
          trap 'kill "$LOG_PID" 2>/dev/null || true' EXIT
          xcrun simctl launch --terminate-running-process "$IPAD_UDID" com.tarlapusula.app | tee ipad-diagnostics/launch.txt
          for WAIT in 10 30 60 90; do
            if [ "$WAIT" -eq 10 ]; then sleep 10; elif [ "$WAIT" -eq 30 ]; then sleep 20; else sleep 30; fi
            xcrun simctl io "$IPAD_UDID" screenshot "ipad-screenshots/ipad-air-11-after-${WAIT}s.png"
            xcrun simctl spawn "$IPAD_UDID" launchctl list | grep -F com.tarlapusula.app >> ipad-diagnostics/process-checks.txt || true
          done
          xcrun simctl spawn "$IPAD_UDID" log show --last 3m --style compact --predicate 'process == "App" OR process == "WebContent"' > ipad-diagnostics/app-recent.log 2>&1 || true
          xcrun simctl terminate "$IPAD_UDID" com.tarlapusula.app || true

      - name: Authenticated iPad-size browser layout audit
        shell: bash
        timeout-minutes: 10
        env:
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${TEST_USER_EMAIL:-}" ] || [ -z "${TEST_USER_PASSWORD:-}" ]; then
            echo "::error::TEST_USER_EMAIL and TEST_USER_PASSWORD repository secrets are required"
            exit 1
          fi
          npm install --no-save --package-lock=false playwright
          npx playwright install chromium
          mkdir -p ipad-authenticated
          (npm run dev -- --host 127.0.0.1 > ipad-authenticated/vite.log 2>&1 & echo $! > ipad-authenticated/vite.pid)
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:834,height:1194},deviceScaleFactor:2,isMobile:true,hasTouch:true});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            try {
              await page.goto('http://127.0.0.1:5173/',{waitUntil:'domcontentloaded',timeout:60000});
              await page.locator('#tp-login-email').fill(process.env.TEST_USER_EMAIL);
              await page.locator('#tp-login-password').fill(process.env.TEST_USER_PASSWORD);
              await page.locator('form:has(#tp-login-email) button[type="submit"]').click();
              await page.waitForTimeout(12000);
              await page.screenshot({path:'ipad-authenticated/01-after-login.png',fullPage:true});
              if(await page.locator('#tp-login-email').isVisible()) throw new Error('Login screen remains visible after test login');
              const audit=async(label)=>{
                const data=await page.evaluate(()=>({screenWidth:innerWidth,documentWidth:document.documentElement.scrollWidth,overflow:[...document.querySelectorAll('body *')].filter(el=>{const r=el.getBoundingClientRect();return r.width>0&&(r.right>innerWidth+4||r.left< -4)}).slice(0,15).map(el=>({tag:el.tagName,cls:String(el.className).slice(0,90)}))}));
                require('fs').writeFileSync('ipad-authenticated/'+label+'.json',JSON.stringify(data,null,2));
                await page.screenshot({path:'ipad-authenticated/'+label+'.png',fullPage:true});
                if(data.documentWidth>data.screenWidth+4) throw new Error(label+' horizontal overflow '+data.documentWidth+'/'+data.screenWidth);
              };
              await audit('02-home');
              for(const [label,pattern] of [['03-map',/Harita/i],['04-weather',/Hava/i],['05-fields',/Tarla/i]]){
                const nav=page.getByRole('button',{name:pattern}).first();
                const link=page.getByRole('link',{name:pattern}).first();
                if(await nav.isVisible().catch(()=>false)) await nav.click();
                else if(await link.isVisible().catch(()=>false)) await link.click();
                else {require('fs').writeFileSync('ipad-authenticated/'+label+'-not-found.txt','Navigation control not found');continue;}
                await page.waitForTimeout(3500);
                await audit(label);
              }
              require('fs').writeFileSync('ipad-authenticated/page-errors.json',JSON.stringify(errors,null,2));
            } finally {await browser.close();}
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE

      - name: Upload authenticated layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipad-authenticated-layout-audit
          path: ipad-authenticated/*
          if-no-files-found: warn
          retention-days: 7

      - name: Upload iPad runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipad-air-11-runtime-diagnostics
          path: ipad-diagnostics/*
          if-no-files-found: warn
          retention-days: 7

      - name: Upload iPad screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipad-air-11-review-screenshots
          path: ipad-screenshots/*.png
          if-no-files-found: warn
          retention-days: 14

name: iOS App Store Signed IPA

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'App Store version, for example 1.0.0'
        required: true
        default: '1.0.0'
        type: string
      build_number:
        description: 'App Store build number; must increase for each upload'
        required: true
        default: '1'
        type: string

concurrency:
  group: ios-app-store-signed-ipa
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  signed-ipa:
    runs-on: macos-15
    env:
      VITE_REVENUECAT_IOS_PUBLIC_KEY: ${{ secrets.VITE_REVENUECAT_IOS_PUBLIC_KEY }}
      VITE_REVENUECAT_ANDROID_PUBLIC_KEY: ${{ secrets.VITE_REVENUECAT_ANDROID_PUBLIC_KEY }}
      VITE_ADMOB_TEST_MODE: 'false'
      VITE_APNS_ENVIRONMENT: 'production'
      VITE_APPLE_SIGN_IN_ENABLED: 'true'
      IOS_DISTRIBUTION_P12_B64: ${{ secrets.IOS_DISTRIBUTION_P12_B64 }}
      IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
      IOS_APP_STORE_PROFILE_B64: ${{ secrets.IOS_APP_STORE_PROFILE_B64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_VERSION_NAME: ${{ inputs.version_name }}
      IOS_BUILD_NUMBER: ${{ inputs.build_number }}
      KEYCHAIN_PASSWORD: temporary-ci-keychain-password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate signing secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            IOS_DISTRIBUTION_P12_B64 \
            IOS_DISTRIBUTION_P12_PASSWORD \
            IOS_APP_STORE_PROFILE_B64 \
            APPLE_TEAM_ID \
            VITE_REVENUECAT_IOS_PUBLIC_KEY
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub secret for $name"
              exit 1
            fi
          done

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Apple distribution certificate and provisioning profile
        shell: bash
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/tarlapusula-distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/tarlapusula-appstore.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/tarlapusula-signing.keychain-db"

          printf '%s' "$IOS_DISTRIBUTION_P12_B64" | base64 --decode > "$CERT_PATH"
          printf '%s' "$IOS_APP_STORE_PROFILE_B64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH"             -P "$IOS_DISTRIBUTION_P12_PASSWORD"             -A             -t cert             -f pkcs12             -k "$KEYCHAIN_PATH"
          security set-key-partition-list             -S apple-tool:,apple:,codesign:             -s             -k "$KEYCHAIN_PASSWORD"             "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          PROFILE_TEAM=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          PROFILE_APS=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$RUNNER_TEMP/profile.plist" 2>/dev/null || true)
          PROFILE_APPLE_SIGNIN=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.applesignin:0' "$RUNNER_TEMP/profile.plist" 2>/dev/null || true)

          if [ "$PROFILE_TEAM" != "$APPLE_TEAM_ID" ]; then
            echo "::error::Provisioning profile Team ID does not match APPLE_TEAM_ID"
            exit 1
          fi

          case "$PROFILE_APP_ID" in
            *".com.tarlapusula.app") ;;
            *)
              echo "::error::Provisioning profile does not match com.tarlapusula.app"
              exit 1
              ;;
          esac

          if [ "$PROFILE_APS" != "production" ]; then
            echo "::error::App Store provisioning profile must contain aps-environment=production"
            exit 1
          fi

          if [ "$PROFILE_APPLE_SIGNIN" != "Default" ]; then
            echo "::error::App Store provisioning profile must contain Sign in with Apple entitlement"
            exit 1
          fi

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build and sync production web assets
        run: |
          npm run build
          npx cap sync ios

      - name: Verify critical native plugins
        shell: bash
        run: |
          set -euo pipefail
          npx cap ls ios | tee "$RUNNER_TEMP/cap-ios-plugins.txt"
          grep -Fq '@revenuecat/purchases-capacitor' "$RUNNER_TEMP/cap-ios-plugins.txt" || {
            echo "::error::RevenueCat native plugin is not installed for ios"
            exit 1
          }
          grep -Fq '@capacitor-community/admob' "$RUNNER_TEMP/cap-ios-plugins.txt" || {
            echo "::error::AdMob native plugin is not installed for ios"
            exit 1
          }

      - name: Archive signed App Store build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-ios-appstore
          xcodebuild             -project ios/App/App.xcodeproj             -scheme App             -configuration Release             -destination 'generic/platform=iOS'             -archivePath build-ios-appstore/TarlaPusula.xcarchive             DEVELOPMENT_TEAM="$APPLE_TEAM_ID"             CODE_SIGN_STYLE=Manual             CODE_SIGN_IDENTITY="Apple Distribution"             PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"             MARKETING_VERSION="$IOS_VERSION_NAME"             CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER"             archive

      - name: Create export options
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.tarlapusula.app</key>
              <string>$PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Export signed IPA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-ios-export
          xcodebuild             -exportArchive             -archivePath build-ios-appstore/TarlaPusula.xcarchive             -exportPath build-ios-export             -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Verify signed IPA
        shell: bash
        run: |
          set -euo pipefail
          IPA_PATH=$(find build-ios-export -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA_PATH"
          rm -rf "$RUNNER_TEMP/ipa-check"
          mkdir -p "$RUNNER_TEMP/ipa-check"
          unzip -q "$IPA_PATH" -d "$RUNNER_TEMP/ipa-check"
          APP_PATH=$(find "$RUNNER_TEMP/ipa-check/Payload" -maxdepth 1 -name '*.app' -print -quit)
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -d --entitlements :- "$APP_PATH" 2> "$RUNNER_TEMP/signed-entitlements.plist"
          APS_ENV=$(/usr/libexec/PlistBuddy -c 'Print :aps-environment' "$RUNNER_TEMP/signed-entitlements.plist")
          SIGNED_APPLE_SIGNIN=$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.applesignin:0' "$RUNNER_TEMP/signed-entitlements.plist" 2>/dev/null || true)
          test "$APS_ENV" = "production"
          test "$SIGNED_APPLE_SIGNIN" = "Default"

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: TarlaPusula-AppStore-v${{ inputs.version_name }}-${{ inputs.build_number }}
          path: build-ios-export/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Clean signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/tarlapusula-distribution.p12"
          rm -f "$RUNNER_TEMP/tarlapusula-appstore.mobileprovision"
          rm -f "$RUNNER_TEMP/profile.plist"
          rm -f "$RUNNER_TEMP/ExportOptions.plist"
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi
